<!DOCTYPE html>
<html>

<head>
    <title>Auto Fill</title>
    <style>
        body {
            font-family: sans-serif;
            width: 320px;
            padding: 12px;
            background: #0f172a;
            color: white;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin-bottom: 8px;
            padding: 6px;
            border-radius: 6px;
            border: none;
            background: #1e293b;
            color: white;
        }

        textarea {
            height: 70px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #38bdf8;
            font-weight: bold;
            cursor: pointer;
        }

        .row {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            font-size: 11px;
            padding: 8px 4px;
        }

        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }

        .tab-btn.inactive {
            background: #1e293b;
            color: white;
        }

        label {
            font-size: 12px;
            display: block;
            margin-bottom: 4px;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 120px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: none;
            object-fit: contain;
            background: #fff;
        }

        .status-text {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
            min-height: 14px;
        }
    </style>
</head>

<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0;">Auto Fill</h3>
    </div>

    <div class="row" style="margin-bottom: 15px;">
        <button id="btnTab1" class="tab-btn active">Manual</button>
        <button id="btnTab2" class="tab-btn inactive">Record</button>
        <button id="btnTab3" class="tab-btn inactive">Gambar</button>
    </div>

    <!-- TAB 1: MANUAL FILL -->
    <div id="tab1">
        <label>Preset</label>
    <div class="row">
        <select id="presetList"></select>
        <button id="savePreset">Save</button>
        <button id="deletePreset">Delete</button>
    </div>

    <label>Selector</label>
    <input id="selector" placeholder="#form input[id^='target'], #form input[id^='pagu']">

    <label>Values (manual optional)</label>
    <textarea id="values" placeholder="Kosongkan jika pakai clipboard"></textarea>

    <div class="row">
        <select id="delimiter">
            <option value=" ">Spasi</option>
            <option value=",">Koma</option>
            <option value="|">Pipe</option>
            <option value="custom">Custom</option>
        </select>

        <select id="mode">
            <option value="pair">Auto Pair</option>
            <option value="single">Single</option>
        </select>
    </div>

    <input id="customDelimiter" placeholder="Custom delimiter" style="display:none">

        <button id="fill">Auto Fill</button>
    </div>

    <!-- TAB 2: RECORD FLOW -->
    <div id="tab2" style="display: none;">
        <label>Form Selector / Target Wrapper (Opsional)</label>
        <input type="text" id="recordFormSelector" placeholder="Contoh: #modal-dialog atau .card">

        <label style="margin-top: 10px; display: block;">Profile Record</label>
        <div class="row">
            <select id="recordProfileList"></select>
            <button id="deleteRecordProfile" style="background: #ef4444; color: white;">Delete</button>
        </div>
        <div class="row" style="margin-top: 5px;">
            <input type="text" id="newProfileInput" placeholder="Nama profile baru..." style="margin-bottom: 0;">
            <button id="saveRecordProfile" style="background: #22c55e; color: white;">Simpan/Update</button>
        </div>

        <button id="btnRecordForm" style="display:none; margin-top: 15px; background: #4ade80; color: #0f172a;">▶ Record Form (Auto Click)</button>
        <button id="btnRecordInput" style="margin-top: 8px; background: #f43f5e; color: white;">● Start Record Input</button>

        <label style="margin-top: 15px; display: block;">Recorded Data</label>
        <textarea id="recordedData" placeholder="Data rekam akan muncul di sini" style="height: 120px; font-family: monospace; font-size: 11px;" readonly></textarea>
        
        <button id="btnClearRecord" style="margin-bottom: 8px; background: #64748b; color: white; padding: 6px;">Clear Record</button>
        <button id="btnEksekusi" style="background: #eab308; color: #0f172a;">⚡ Eksekusi Autofill</button>
    </div>

    <!-- TAB 3: RECORD DARI GAMBAR -->
    <div id="tab3" style="display: none;">
        <label>Upload / Paste Gambar</label>
        <input type="file" id="imageFileInput" accept="image/*">
        <img id="imagePreview" alt="Preview">

        <div class="row" style="align-items: center; gap: 8px; margin-bottom: 8px;">
            <button id="btnReadGambar" style="background: #a855f7; color: white; flex: 1;">Read Gambar (OCR)</button>
            <div style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0;">
                <label style="font-size: 10px; color: #94a3b8; margin: 0;">Jumlah kolom</label>
                <input id="imageNumCols" type="number" min="2" max="30" placeholder="auto"
                    style="width: 62px; margin: 0; padding: 4px 6px; font-size: 12px; text-align: center;">
            </div>
        </div>
        <p id="imageOcrStatus" class="status-text"></p>

        <label>Record Read (editable - 1 nilai per baris)</label>
        <textarea id="imageRecordRead" placeholder="1&#10;92480000&#10;1&#10;92480000&#10;..." style="height: 120px; font-family: monospace; font-size: 12px; line-height: 1.35;"></textarea>

        <button id="btnParseImageRead" style="background: #6366f1; color: white; padding: 6px; margin-bottom: 8px;">Generate Record Input</button>

        <label>Record Input (JSON)</label>
        <textarea id="imageRecordInput" placeholder="[{ &quot;selector&quot;: &quot;#target0&quot;, ... }]" style="height: 120px; font-family: monospace; font-size: 11px;" readonly></textarea>

        <button id="btnClearImageRecord" style="margin-bottom: 8px; background: #64748b; color: white; padding: 6px;">Clear Record</button>
        <button id="btnEksekusiImage" style="background: #eab308; color: #0f172a;">Eksekusi ke Form</button>
    </div>

    <script src="lib/tesseract.min.js"></script>
    <script src="imageRecord.js"></script>
    <script src="imageOcr.js"></script>
    <script src="popup.js"></script>
</body>

</html>
